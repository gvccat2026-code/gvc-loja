<style>

/* Layout: login com bandeira turquesa → gestão (menu lateral no computador, abas no celular) → vitrine em grade de fichas */
:root{
  --turq:#17A7C1; --turq-ink:#0B5F6E; --turq-wash:#E3F4F7;
  --petro:#2E7D86; --petro-ink:#1F5960;
  --graf:#12201F; --prata:#D6DEE0; --gelo:#F5F8F8;
  --bg:#F5F8F8; --surface:#FFFFFF; --surface-2:#EDF2F3;
  --fg:#12201F; --fg-2:#4A5B5C; --fg-3:#6F8081; --line:#D6DEE0;
  --head:#12201F; --on-head:#F5F8F8; --on-petro:#FFFFFF;
  --ok:#1E7A4C; --ok-wash:#E2F2E9; --warn:#8F5B00; --warn-wash:#FBF0DA; --bad:#B03A2E; --bad-wash:#F8E4E1;
  --display:'Saira Condensed','Arial Narrow',sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --turq:#3BC0D8; --turq-ink:#A9E6F1; --turq-wash:#123A40;
  --petro:#4FA3AC; --petro-ink:#BFE3E7;
  --bg:#0E1817; --surface:#152321; --surface-2:#1C2D2B;
  --fg:#E8F0F0; --fg-2:#A9B8B9; --fg-3:#8A9B9C; --line:#2A3C3A;
  --head:#08100F; --on-head:#E8F0F0; --on-petro:#0E1817;
  --ok:#5CC48C; --ok-wash:#173528; --warn:#E5B04C; --warn-wash:#3A2C10; --bad:#EE7F72; --bad-wash:#3E1D19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --turq:#3BC0D8; --turq-ink:#A9E6F1; --turq-wash:#123A40;
  --petro:#4FA3AC; --petro-ink:#BFE3E7;
  --bg:#0E1817; --surface:#152321; --surface-2:#1C2D2B;
  --fg:#E8F0F0; --fg-2:#A9B8B9; --fg-3:#8A9B9C; --line:#2A3C3A;
  --head:#08100F; --on-head:#E8F0F0; --on-petro:#0E1817;
  --ok:#5CC48C; --ok-wash:#173528; --warn:#E5B04C; --warn-wash:#3A2C10; --bad:#EE7F72; --bad-wash:#3E1D19;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--turq);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.muted{color:var(--fg-2)}

/* ── LOGIN ── */
#login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.flag{background:#17A7C1;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:40px clamp(20px,5vw,56px);color:#FFFFFF}
.flag::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 2px,transparent 2px 120px);pointer-events:none}
.flag .castle{position:absolute;right:-6%;bottom:-8%;width:min(78%,520px);opacity:.22}
.flag-top{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.flag-top img{width:64px}
.flag-top b{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:.06em;line-height:1}
.flag-top span{display:block;font-size:12.5px;letter-spacing:.04em;color:#F2FBFD}
.flag-mid{position:relative;z-index:1;max-width:24ch}
.flag-mid h1{font-size:clamp(40px,6vw,68px);font-weight:800;line-height:.95;text-transform:uppercase;color:#FFFFFF}
.flag-mid p{font-size:16px;margin:14px 0 0;color:#F2FBFD;max-width:34ch}
.motto{position:relative;z-index:1;font-family:var(--display);font-weight:700;letter-spacing:.3em;font-size:13px;color:#0B4A55}
.panel-login{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--bg)}
.card-login{width:100%;max-width:400px;display:flex;flex-direction:column;gap:22px}
.card-login h2{font-size:30px;font-weight:700}
.card-login .sub{color:var(--fg-2);margin:4px 0 0;font-size:14.5px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-size:14.5px}
.mode small{color:var(--fg-3);font-size:12.5px}
.mode[aria-pressed="true"]{border-color:var(--petro);background:var(--turq-wash);box-shadow:inset 0 0 0 1px var(--petro)}
.who{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.who .av{width:40px;height:40px;border-radius:10px;background:var(--graf);display:grid;place-items:center;flex:0 0 auto}
.who .av img{width:28px}
.who b{display:block;font-size:14.5px}
.who small{color:var(--fg-3)}

/* buttons */
.btn{border-radius:10px;padding:10px 16px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--petro)}
.btn.pri{background:var(--petro);border-color:var(--petro);color:var(--on-petro)}
.btn.pri:hover{background:var(--petro-ink);border-color:var(--petro-ink)}
.btn.big{padding:15px 18px;font-size:15.5px;justify-content:space-between;width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad-wash)}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--petro-ink);text-decoration:underline;text-underline-offset:3px}

/* ── APP SHELL ── */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--head);color:var(--on-head);display:flex;flex-direction:column;padding:20px 12px;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:38px}
.brand b{font-family:var(--display);font-size:24px;letter-spacing:.08em;line-height:1}
.brand small{display:block;font-size:11.5px;color:#9FB3B5;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{background:none;border:0;border-radius:8px;padding:10px 12px;text-align:left;color:#C8D6D7;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav button:hover{background:rgba(255,255,255,.06);color:#FFFFFF}
.nav button[aria-current="page"]{background:#2E7D86;color:#FFFFFF}
.nav .tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#7FA4A8}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.side-foot button{background:rgba(255,255,255,.06);border:0;border-radius:8px;padding:9px 10px;color:#C8D6D7;text-align:left;font-size:13.5px}
.side-foot button:hover{background:rgba(255,255,255,.12);color:#FFFFFF}
.side-foot .who-s{font-size:12px;color:#9FB3B5;padding:0 6px 4px}
.topbar,.tabs{display:none}
main.content{padding-block:24px 72px;padding-inline:clamp(16px,3vw,36px);min-width:0;max-width:1180px}
.topbar{align-items:center;justify-content:space-between;gap:10px;background:var(--head);color:var(--on-head);padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.topbar .brand img{width:30px}.topbar .brand b{font-size:20px}
.topbar button{background:rgba(255,255,255,.08);border:0;border-radius:8px;padding:7px 10px;color:#E8F0F0;font-size:12.5px}
.tabs{gap:6px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--fg-2)}
.tabs button[aria-current="page"]{background:var(--petro);border-color:var(--petro);color:var(--on-petro)}
/* mobile mode (escolhido no login) */
.m .shell{grid-template-columns:minmax(0,1fr);max-width:480px;margin:0 auto}
.m .side{display:none}
.m .topbar,.m .tabs{display:flex}
.m main.content{padding-inline:16px}

/* page */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{font-size:34px;font-weight:800;line-height:1}
.page-head .when{color:var(--fg-2);font-size:14px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi .hd{background:var(--head);color:var(--on-head);font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px}
.kpi .bd{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05}
.kpi .s{font-size:12.5px;color:var(--fg-3)}
.stock{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px}
.st{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.st b{font-family:var(--display);font-size:26px;line-height:1}
.st span{font-size:12.5px;color:var(--fg-2)}
.st.bad{border-left-color:var(--bad)}.st.warn{border-left-color:var(--warn)}.st.info{border-left-color:var(--turq)}.st.neu{border-left-color:var(--fg-3)}
button.st:hover{border-color:var(--petro)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.block .hd{background:var(--head);color:var(--on-head);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.block .hd small{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500;color:#9FB3B5;font-size:12px}
.block .bd{padding:14px}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:14px}
.full{margin-top:14px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--fg-2);display:flex;flex-direction:column;gap:6px}
.empty b{color:var(--fg);font-size:15px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:0}
.wrap-x{overflow-x:auto}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.bad{background:var(--bad-wash);color:var(--bad)}.pill.warn{background:var(--warn-wash);color:var(--warn)}.pill.ok{background:var(--ok-wash);color:var(--ok)}.pill.info{background:var(--turq-wash);color:var(--turq-ink)}.pill.neu{background:var(--surface-2);color:var(--fg-2)}
.note{font-size:12.5px;color:var(--fg-3);margin:10px 0 0}
.soon{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 22px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.soon h3{font-size:26px}

/* produtos list */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:10px;text-align:left;align-items:center}
.pcard:hover{border-color:var(--petro)}
.thumb{width:84px;height:84px;border-radius:9px;overflow:hidden;display:grid;place-items:center;position:relative;flex:0 0 auto}
.thumb img.ph{width:100%;height:100%;object-fit:cover}
.thumb img.cs{width:56%;opacity:.9}
.pcard .nm{font-weight:700;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .meta{font-size:12.5px;color:var(--fg-3)}
.pcard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.pcard .pr{font-family:var(--display);font-weight:700;font-size:19px;color:var(--petro-ink)}

/* forms */
.form{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.fsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.fsec h3{font-size:20px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label,.f .lb{font-size:13px;font-weight:600;color:var(--fg-2)}
.f input[type=text],.f input[type=number],.f input:not([type]),.f select,.f textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--petro);background:var(--surface);outline:none}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:12px;color:var(--fg-3)}
.f .err{font-size:12.5px;color:var(--bad);font-weight:600}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.money{position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-3);font-size:14px;pointer-events:none}
.money input{padding-left:36px!important}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;font-weight:600;font-size:13.5px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vbox{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.vbox b{font-family:var(--display);font-size:22px;line-height:1}
.vbox input{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;width:100%;text-align:center}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--petro)}
.alert{border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600}
.alert.warn{background:var(--warn-wash);color:var(--warn)}
.alert.bad{background:var(--bad-wash);color:var(--bad)}
.alert.info{background:var(--turq-wash);color:var(--turq-ink)}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pslot{aspect-ratio:1;max-width:100%;border-radius:9px;overflow:hidden;position:relative;border:1px solid var(--line);background:var(--surface-2)}
.pslot img{width:100%;height:100%;object-fit:cover;display:block}
.pslot .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(18,32,31,.75);color:#FFFFFF;font-size:14px;line-height:1}
.pslot .main{position:absolute;left:4px;bottom:4px;background:rgba(18,32,31,.75);color:#FFFFFF;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px}
.pslot .mk{position:absolute;left:4px;bottom:4px;border:0;background:rgba(18,32,31,.6);color:#FFFFFF;font-size:10.5px;padding:2px 6px;border-radius:6px}
.padd{aspect-ratio:1;max-width:100%;border-radius:9px;border:1.5px dashed var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:600;color:var(--fg-2);text-align:center;padding:6px;cursor:pointer}
.padd:hover{border-color:var(--petro);color:var(--petro-ink)}
.padd big{font-size:24px;line-height:1}
.preview-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;position:sticky;bottom:0;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:14px;z-index:3}
.actions .sp{margin-right:auto}

/* config */
.cfg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.catrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center}
.catrow input[type=color]{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.catrow input[type=text]{border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
details.dev{border:1.5px dashed var(--warn);border-radius:12px;background:var(--surface)}
details.dev summary{padding:14px 16px;cursor:pointer;font-weight:700;color:var(--warn)}
details.dev .in{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}

/* ── VITRINE ── */
#vitrine{min-height:100vh;background:var(--bg)}
.v-head{background:#17A7C1;color:#FFFFFF;position:relative;overflow:hidden}
.v-head-in{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 16px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.v-head .castle{position:absolute;right:2%;top:-30%;width:300px;opacity:.18}
.v-brand{display:flex;align-items:center;gap:14px}
.v-brand img{width:56px}
.v-brand b{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:.06em;line-height:1;display:block}
.v-brand span{font-size:13.5px;color:#F2FBFD}
.v-head button{background:rgba(0,0,0,.22);border:0;color:#FFFFFF;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13.5px}
.v-body{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;font-weight:600;font-size:13.5px;color:var(--fg-2)}
.chip[aria-pressed="true"]{border-color:var(--petro);background:var(--petro);color:var(--on-petro)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph-box{aspect-ratio:4/3;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden}
.ph-box img.ph{width:100%;height:100%;object-fit:cover}
.ph-box img.cs{width:42%;opacity:.9}
.ph-box .cat{position:absolute;left:12px;bottom:10px;font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;color:#FFFFFF;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ph-box .badge{position:absolute;top:10px;right:10px}
.prod .in{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.prod h3{font-size:23px;font-weight:700;line-height:1.05}
.prod .desc{font-size:13.5px;color:var(--fg-2);margin:0}
.price{font-family:var(--display);font-size:26px;font-weight:700;color:var(--petro-ink)}
.price s{font-size:17px;color:var(--fg-3);margin-left:6px;font-weight:500}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.size{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;display:flex;gap:6px;align-items:baseline}
.size b{font-family:var(--display);font-size:16px}
.size.out{opacity:.55;text-decoration:line-through}
.size.low{border-color:var(--warn);background:var(--warn-wash)}
.qty{font-size:13px;color:var(--fg-2)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(8,16,15,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal .box{background:var(--surface);border-radius:14px;max-width:440px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal .box h3{font-size:24px}
.modal .box p{margin:0;color:var(--fg-2)}
.modal .box input{border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:10px 12px}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--graf);color:#F5F8F8;padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}

@media (max-width:820px){
  #login{grid-template-columns:minmax(0,1fr)}
  .flag{min-height:320px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar,.tabs{display:flex}
  main.content{padding-inline:16px}
}
@media (max-width:820px){.kpis,.stock{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.form,.cfg{grid-template-columns:minmax(0,1fr)}}
.m .kpis,.m .stock{grid-template-columns:repeat(2,minmax(0,1fr))}
.m .two,.m .form,.m .cfg{grid-template-columns:minmax(0,1fr)}
@media (max-width:420px){.photos{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .22s ease}}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1}}

:root{padding:0}
.v-status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-3)}
.v-status i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.v-status.off i{background:var(--warn)}
.v-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.v-search{flex:1 1 220px;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.prod{cursor:pointer;text-align:left}
.prod.sold .ph-box{filter:grayscale(.7);opacity:.8}
.v-cta{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--turq);padding:12px 14px;font-size:14px;color:var(--fg-2)}
.v-cta b{color:var(--fg)}
.detail .box{max-width:520px;padding:0;overflow:hidden;max-height:calc(100vh - 40px);overflow-y:auto}
.detail .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--surface-2)}
.detail .gal img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:start}
.detail .gal .cs-box{flex:0 0 100%;aspect-ratio:1;display:grid;place-items:center}
.detail .gal .cs-box img{width:45%;aspect-ratio:auto}
.detail .in{padding:16px;display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:6px;justify-content:center;padding:8px 0 0}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}

<script>
'use strict';
/* ════════ CONFIGURAÇÃO DO FIREBASE (preenchida na publicação) ════════ */
const FIREBASE_CONFIG = {"apiKey": "AIzaSyCwL8RIVT_oW2GLk-nrTHi88KBM85bLJcg", "authDomain": "gvc-loja.firebaseapp.com", "projectId": "gvc-loja", "storageBucket": "gvc-loja.firebasestorage.app", "messagingSenderId": "658773217290", "appId": "1:658773217290:web:ddb75f87c9aba0282c0ff3"};

/* ════════ UTIL ════════ */
const U={
  esc:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  brl:v=>v==null||isNaN(v)?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),
  brl0:v=>v==null||isNaN(v)?'—':'R$ '+Math.round(v).toLocaleString('pt-BR'),
  pct:v=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%',
  /* data e hora sempre no horário de Brasília */
  hoje:()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date()),
  hora:()=>new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'}).format(new Date()),
  fmtData:d=>{if(!d)return'—';const[y,m,dd]=String(d).slice(0,10).split('-');return`${dd}/${m}/${y}`},
  norm:s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(),
  num:v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(',','.'));return isNaN(n)?null:n},
  uid:p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
  round2:v=>Math.round(v*100)/100,
};
const TAMANHOS=['P','M','G'];
const LOJA_PADRAO={nome:'GVC',ultimasUnidades:2,taxas:{pix:0,debito:1.39,credito:3.34,parcelado12:13.38},
  categorias:[{id:'vest',nome:'Vestuário',cor:'#2E7D86'},{id:'aces',nome:'Acessórios',cor:'#0B5F6E'},{id:'lemb',nome:'Lembranças',cor:'#12201F'}]};

/* regras de estoque compartilhadas por vitrine e gestão */
const Est={
  total:p=>(p.tamanhos||[]).reduce((s,t)=>s+Math.max(0,(p.estoque||{})[t]||0),0),
  de:(p,t)=>(p.estoque||{})[t]||0,
  unico:p=>(p.tamanhos||[]).length===1&&p.tamanhos[0]==='U',
  rotulo:t=>t==='U'?'Unidade':t,
  selo(q,lim){if(q<=0)return{c:'bad',t:'Esgotado'};if(q<=lim)return{c:'warn',t:'Últimas unidades'};return null},
};

/* ════════ CAMADA DE DADOS ════════
   Mesma interface para o Firebase real e para o modo de teste local (sem internet). */
function criarDB(){
  const mock=!FIREBASE_CONFIG||window.__GVC_MOCK__===true||/[?&]teste\b/.test(location.search);
  return mock?MockDB():FireDB();
}

function FireDB(){
  let app,fs,auth,FV;
  const api={modo:'firebase',
    async init({offline}={}){
      app=firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();FV=firebase.firestore.FieldValue;
      if(offline){try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}}
      if(firebase.auth)auth=firebase.auth();
    },
    onAuth(cb){auth.onAuthStateChanged(u=>cb(u?{email:u.email,uid:u.uid}:null))},
    async entrar(email,senha){await auth.signInWithEmailAndPassword(email,senha)},
    async sair(){await auth.signOut()},
    watchLoja(cb,err){return fs.collection('loja').doc('config').onSnapshot(d=>cb(Object.assign({},LOJA_PADRAO,d.exists?d.data():{})),err)},
    async salvarLoja(dados){await fs.collection('loja').doc('config').set(dados,{merge:true})},
    watchProdutos(cb,err){return fs.collection('produtos').onSnapshot({includeMetadataChanges:true},q=>cb(q.docs.map(d=>({id:d.id,...d.data()})),{fromCache:q.metadata.fromCache}),err)},
    watchCustos(cb,err){return fs.collection('custos').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data().custo);cb(o)},err)},
    async foto(id){const d=await fs.collection('fotos').doc(id).get();return d.exists?d.data().data:null},
    novoId(col){return fs.collection(col).doc().id},
    async salvarProduto({id,dados,custo,ajustes,fotosNovas,fotosRemovidas,autor}){
      const b=fs.batch();const ref=fs.collection('produtos').doc(id);
      const doc=Object.assign({},dados,{atualizadoEm:FV.serverTimestamp()});delete doc.estoque;delete doc.estoqueInicial;
      b.set(ref,doc,{merge:true});
      /* estoque: aplica só a diferença, para não apagar vendas feitas ao mesmo tempo em outro caixa */
      const up={};let tem=false;Object.entries(ajustes||{}).forEach(([t,d])=>{if(d){up['estoque.'+t]=FV.increment(d);tem=true}});
      if(dados.estoqueInicial){b.set(ref,{estoque:dados.estoqueInicial},{merge:true})}else if(tem)b.update(ref,up);
      b.set(fs.collection('custos').doc(id),{custo:custo??null});
      (fotosNovas||[]).forEach(f=>b.set(fs.collection('fotos').doc(f.id),{prodId:id,data:f.data}));
      (fotosRemovidas||[]).forEach(f=>b.delete(fs.collection('fotos').doc(f)));
      if(tem||dados.estoqueInicial)b.set(fs.collection('movimentos').doc(),{prodId:id,tipo:dados.estoqueInicial?'inicial':'ajuste',qtd:dados.estoqueInicial||ajustes,data:U.hoje(),hora:U.hora(),autor:autor||'',em:FV.serverTimestamp()});
      await b.commit();
    },
    async excluirProduto(p){const b=fs.batch();b.delete(fs.collection('produtos').doc(p.id));b.delete(fs.collection('custos').doc(p.id));(p.fotos||[]).forEach(f=>b.delete(fs.collection('fotos').doc(f)));await b.commit()},
    /* venda: grava a venda e baixa o estoque juntos; funciona mesmo com internet oscilando (envia quando voltar) */
    async registrarVenda(v){const b=fs.batch();const ref=fs.collection('vendas').doc(v.id);
      b.set(ref,Object.assign({},v,{criadoEm:FV.serverTimestamp()}));
      v.itens.forEach(it=>b.update(fs.collection('produtos').doc(it.prodId),{['estoque.'+it.tam]:FV.increment(-it.qtd)}));
      const p=b.commit();await Promise.race([p,new Promise(r=>setTimeout(r,2500))]);return p},
    async cancelarVenda(v,autor){const b=fs.batch();b.update(fs.collection('vendas').doc(v.id),{cancelada:true,canceladaPor:autor||'',canceladaEm:U.hora()});
      v.itens.forEach(it=>b.update(fs.collection('produtos').doc(it.prodId),{['estoque.'+it.tam]:FV.increment(it.qtd)}));
      const p=b.commit();await Promise.race([p,new Promise(r=>setTimeout(r,2500))]);return p},
    watchVendas(data,cb,err){return fs.collection('vendas').where('data','==',data).onSnapshot({includeMetadataChanges:true},q=>cb(q.docs.map(d=>({id:d.id,...d.data(),_pendente:d.metadata.hasPendingWrites}))),err)},
    async todasVendas(){const q=await fs.collection('vendas').get();return q.docs.map(d=>({id:d.id,...d.data(),criadoEm:null}))},
    async todasFotos(){const q=await fs.collection('fotos').get();const o={};q.docs.forEach(d=>o[d.id]=d.data());return o},
    online(cb){const f=()=>cb(navigator.onLine);window.addEventListener('online',f);window.addEventListener('offline',f);f()},
  };
  return api;
}

/* modo de teste: tudo no navegador, compartilhado entre abas pelo localStorage */
function MockDB(){
  const K='gvc_mock_db_v1';
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}};
  let st=Object.assign({loja:null,produtos:{},custos:{},fotos:{},vendas:{},movimentos:[],user:null},load());
  const subs=new Set();
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}subs.forEach(f=>f())};
  window.addEventListener('storage',e=>{if(e.key===K){st=Object.assign(st,load());subs.forEach(f=>f())}});
  const sub=fn=>{subs.add(fn);setTimeout(fn,0);return()=>subs.delete(fn)};
  const clone=o=>JSON.parse(JSON.stringify(o));
  let authCb=null;
  return{modo:'teste',
    async init(){},
    onAuth(cb){authCb=cb;setTimeout(()=>cb(st.user),0)},
    async entrar(email,senha){if(!email||!senha||senha.length<6){const e=new Error('x');e.code='auth/invalid-credential';throw e}st.user={email,uid:'u1'};save();authCb&&authCb(st.user)},
    async sair(){st.user=null;save();authCb&&authCb(null)},
    watchLoja(cb){return sub(()=>cb(Object.assign({},LOJA_PADRAO,st.loja||{})))},
    async salvarLoja(d){st.loja=Object.assign({},st.loja||{},clone(d));save()},
    watchProdutos(cb){return sub(()=>cb(Object.entries(st.produtos).map(([id,p])=>({id,...clone(p)})),{fromCache:false}))},
    watchCustos(cb){return sub(()=>cb(clone(st.custos)))},
    async foto(id){return st.fotos[id]?st.fotos[id].data:null},
    novoId(){return U.uid('x')},
    async salvarProduto({id,dados,custo,ajustes,fotosNovas,fotosRemovidas}){
      const p=st.produtos[id]||{};const est=dados.estoqueInicial?clone(dados.estoqueInicial):(p.estoque||{});
      Object.entries(ajustes||{}).forEach(([t,d])=>est[t]=(est[t]||0)+d);
      const doc=clone(dados);delete doc.estoqueInicial;doc.estoque=est;st.produtos[id]=Object.assign(p,doc);
      st.custos[id]=custo??null;(fotosNovas||[]).forEach(f=>st.fotos[f.id]={prodId:id,data:f.data});(fotosRemovidas||[]).forEach(f=>delete st.fotos[f]);save()},
    async excluirProduto(p){delete st.produtos[p.id];delete st.custos[p.id];(p.fotos||[]).forEach(f=>delete st.fotos[f]);save()},
    async registrarVenda(v){st.vendas[v.id]=clone(v);v.itens.forEach(it=>{const p=st.produtos[it.prodId];if(p){p.estoque[it.tam]=(p.estoque[it.tam]||0)-it.qtd}});save()},
    async cancelarVenda(v,autor){const x=st.vendas[v.id];x.cancelada=true;x.canceladaPor=autor;x.canceladaEm=U.hora();v.itens.forEach(it=>{const p=st.produtos[it.prodId];if(p)p.estoque[it.tam]=(p.estoque[it.tam]||0)+it.qtd});save()},
    watchVendas(data,cb){return sub(()=>cb(Object.entries(st.vendas).map(([id,v])=>({id,...clone(v)})).filter(v=>v.data===data)))},
    async todasVendas(){return Object.values(clone(st.vendas))},
    async todasFotos(){return clone(st.fotos)},
    online(cb){const f=()=>cb(navigator.onLine);window.addEventListener('online',f);window.addEventListener('offline',f);f()},
  };
}

/* fotos: recorta em quadrado e comprime para caber no banco e carregar rápido no 4G */
function comprimirFoto(file,lado=640,q=.72){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('leitura'));fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('imagem'));img.onload=()=>{const s=Math.min(img.width,img.height),T=Math.min(lado,s);const c=document.createElement('canvas');c.width=c.height=T;const x=c.getContext('2d');x.fillStyle='#FFFFFF';x.fillRect(0,0,T,T);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,T,T);res(c.toDataURL('image/jpeg',q))};img.src=fr.result};fr.readAsDataURL(file)})}

/* cache de fotos em memória */
const FotoCache={m:new Map(),async get(db,id){if(!id)return null;if(this.m.has(id))return this.m.get(id);const p=db.foto(id).catch(()=>null);this.m.set(id,p);const v=await p;this.m.set(id,v);return v},
  hidratar(db,root){root.querySelectorAll('img[data-foto]').forEach(async im=>{const v=await this.get(db,im.dataset.foto);if(v&&im.isConnected)im.src=v})}};

function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

/* confirmação dentro da página */
function confirmar({titulo,texto,ok='Confirmar',perigo=false,digitar=null}){return new Promise(res=>{let root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdT"><div class="box"><h3 id="mdT">${U.esc(titulo)}</h3><p>${texto}</p>${digitar?`<label class="muted" for="mdIn" style="font-size:13px">Digite <b>${U.esc(digitar)}</b> para confirmar</label><input id="mdIn" autocomplete="off">`:''}<div class="row"><button class="btn" id="mdNo">Cancelar</button><button class="btn ${perigo?'danger':'pri'}" id="mdOk">${U.esc(ok)}</button></div></div></div>`;
  const fim=v=>{root.innerHTML='';res(v)};document.getElementById('mdNo').onclick=()=>fim(false);
  document.getElementById('mdOk').onclick=()=>{if(digitar){const v=document.getElementById('mdIn').value.trim().toUpperCase();if(v!==digitar.toUpperCase()){toast(`Digite ${digitar} para confirmar`);return}}fim(true)};
  (document.getElementById('mdIn')||document.getElementById('mdOk')).focus()})}

}
function fechar(){aberto=null;document.getElementById('modalRoot').innerHTML=''}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;render();return}
  if(e.target.closest('[data-close]')&&(e.target.dataset.close||e.target.closest('button[data-close]'))){fechar();return}
  const pr=e.target.closest('.prod[data-prod]');if(pr&&!e.target.closest('.modal'))abrir(pr.dataset.prod);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});
document.getElementById('busca').addEventListener('input',e=>{busca=e.target.value;render()});
function status(t,off){const s=document.getElementById('status');s.classList.toggle('off',!!off);s.querySelector('span').textContent=t}
(async()=>{
  try{await db.init({offline:false})}catch(e){status('Não foi possível conectar. Recarregue a página.',true);return}
  db.watchLoja(l=>{loja=l;render()},()=>{});
  db.watchProdutos((ps,meta)=>{produtos=ps;if(meta&&meta.fromCache){if(ps.length){carregou=true;status('Conexão fraca. Mostrando o último estoque carregado.',true)}else status('Conectando ao estoque…',true)}else{carregou=true;status('Estoque ao vivo · atualizado às '+U.hora())}render()},()=>status('Sem conexão. Mostrando o último estoque carregado.',true));
  db.online(on=>{if(!on)status('Sem internet. O estoque pode estar desatualizado.',true)});
})();
</script>
